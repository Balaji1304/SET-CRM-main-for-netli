services:
  - type: web
    name: solar-crm-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
    installPackages:
      - gconf-service
      - libasound2
      - libatk1.0-0
      - libcups2
      - libdbus-1-3
      - libgconf-2-4
      - libnspr4
      - libnss3
      - libxss1
      - fonts-liberation
      - lsb-release
      - xdg-utils
      - wget